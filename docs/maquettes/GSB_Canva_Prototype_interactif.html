<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142D4E">
  <title>GSB — E-boutique professionnelle · Maquette</title>
  <style>/* GSB — E-boutique professionnelle. Échelle d’espacement de 8 px. */
:root {
  --navy: #142d4e;
  --teal: #159a9c;
  --teal-dark: #0c7476;
  --bg: #f5f7fa;
  --ink: #1f2937;
  --muted: #64748b;
  --line: #dce4ec;
  --radius: 12px;
  --success: #176745;
  --warning: #8a4c04;
  --danger: #b12d3e;
  --shadow: 0 8px 28px rgba(20, 45, 78, .045);
  --font: Inter, "Segoe UI", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font: 15px/1.55 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, a { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled, input:disabled, select:disabled { cursor: not-allowed; }
a { color: var(--teal-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }
img { display: block; max-width: 100%; }
svg { display: block; flex-shrink: 0; }
button svg, a svg { width: 20px; height: 20px; }
h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3, h4 { color: var(--navy); line-height: 1.22; }
h1 { margin-bottom: 16px; font-size: 36px; letter-spacing: -1.2px; font-weight: 700; }
h2 { margin-bottom: 16px; font-size: 24px; letter-spacing: -.6px; }
h3 { margin-bottom: 8px; font-size: 18px; letter-spacing: -.25px; }
h4 { margin-bottom: 8px; font-size: 15px; }
p { margin-bottom: 16px; }
small { font-size: 12px; }
hr { margin: 24px 0; border: 0; border-top: 1px solid var(--line); }
ul { padding-left: 20px; }
[hidden] { display: none !important; }
.app-shell { min-height: 100vh; }
.shell { width: min(1312px, calc(100% - 96px)); margin-inline: auto; }
.row { display: flex; align-items: center; gap: 16px; }
.row.between, .between { justify-content: space-between; }
.row.wrap, .wrap { flex-wrap: wrap; }
.row.start { align-items: flex-start; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > :last-child { margin-bottom: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.full-width { width: 100%; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.section-gap { margin-top: 32px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.strong { font-weight: 650; color: var(--navy); }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* Navigation boutique */
.shop-header { min-height: 88px; border-bottom: 1px solid var(--line); background: #fff; }
.shop-header > .shell { min-height: 88px; display: flex; align-items: center; gap: 40px; }
.logo { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; color: var(--navy); text-decoration: none !important; }
.logo-mark { width: 40px; height: 40px; display: grid; place-items: center; color: #fff; background: var(--navy); border-radius: 10px; font-size: 14px; font-weight: 750; letter-spacing: -.6px; }
.logo strong { display: block; color: var(--navy); font-size: 25px; line-height: 1; letter-spacing: -1px; }
.logo span small, .logo small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.1; letter-spacing: .15px; }
.nav-links { display: flex; align-self: stretch; align-items: stretch; gap: 32px; }
.nav-links a { display: inline-flex; position: relative; align-items: center; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; }
.nav-links a:hover, .nav-links a.is-active { color: var(--navy); }
.nav-links a.is-active::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--teal); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.user-pill { display: flex; gap: 10px; align-items: center; padding-left: 20px; border-left: 1px solid var(--line); color: var(--navy); font-size: 13px; }
.user-pill strong { display: block; font-size: 13px; line-height: 1.4; }
.user-pill small { display: block; color: var(--muted); font-size: 11px; }
.avatar { display: inline-grid; place-items: center; flex-shrink: 0; width: 40px; height: 40px; border: 1px solid #cae7e7; border-radius: 50%; color: var(--teal-dark); background: #e8f6f5; font-size: 12px; font-weight: 700; }
.cart-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; color: #fff; background: var(--teal-dark); font-size: 11px; }
.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 24px 0; color: var(--muted); font-size: 12px; }
.breadcrumb a { color: var(--muted); }
.breadcrumb svg { width: 14px; height: 14px; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin: 32px 0; }
.page-heading h1 { margin-bottom: 8px; }
.page-heading p { max-width: 680px; margin-bottom: 0; color: var(--muted); }
.eyebrow { display: block; margin-bottom: 12px; color: var(--teal-dark); font-size: 11px; font-weight: 750; letter-spacing: 1.6px; text-transform: uppercase; }

/* Catalogue, recherche et cartes produits */
.hero { position: relative; display: flex; align-items: center; overflow: hidden; isolation: isolate; min-height: 224px; padding: 40px 48px; margin: 24px 0 32px; border-radius: 16px; color: #dbe8ef; background: var(--navy); }
.hero > div:first-child { position: relative; z-index: 2; max-width: 660px; }
.hero h1, .hero h2 { margin-bottom: 12px; color: #fff; font-size: 36px; letter-spacing: -1.2px; }
.hero p { margin-bottom: 0; max-width: 590px; color: #cedce8; font-size: 15px; }
.hero .eyebrow { color: #8cddda; }
.hero-orbit { position: absolute; z-index: 0; right: 60px; top: -64px; width: 340px; height: 340px; border: 1px solid rgba(150, 223, 219, .22); border-radius: 50%; }
.hero-orbit::before { content: ""; position: absolute; inset: 48px; border: 1px solid rgba(150, 223, 219, .24); border-radius: 50%; }
.hero-orbit::after { content: "+"; position: absolute; inset: 106px; display: grid; place-items: center; border-radius: 28px; color: #a5e9e3; background: #1d5265; font-size: 74px; font-weight: 300; line-height: 1; }
.catalog-layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 32px; align-items: start; }
.filters { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.filters h3 { margin-bottom: 24px; font-size: 16px; }
.filters h4 { margin: 24px 0 12px; font-size: 12px; letter-spacing: .7px; text-transform: uppercase; }
.filter-option { display: flex; align-items: center; gap: 10px; min-height: 44px; color: #465568; font-size: 13px; }
.filter-option input { width: 16px; height: 16px; margin: 0; accent-color: var(--teal-dark); }
.filter-option .count { margin-left: auto; color: var(--muted); font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 22px; color: #4a5b70; background: #fff; font-size: 12px; font-weight: 550; white-space: nowrap; }
.chip:hover { border-color: #82c7c6; }
.chip.is-active { border-color: #b6dddd; color: var(--teal-dark); background: #e7f5f3; }
.toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin: 0 0 24px; }
.toolbar > p { margin: 0; color: var(--muted); font-size: 13px; }
.toolbar strong { color: var(--navy); }
.toolbar select { min-height: 44px; padding: 10px 32px 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; font-size: 13px; }
.search-field { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); }
.search-field:focus-within { border-color: var(--teal); outline: 3px solid #d7efed; }
.search-field svg { width: 20px; height: 20px; }
.search-field input { flex: 1; min-width: 0; width: 100%; min-height: 46px; padding: 8px 0; border: 0; outline: none; color: var(--ink); background: transparent; font-size: 13px; }
.search-field input::placeholder { color: #64748b; opacity: 1; }
.product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.product-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; transition: box-shadow .18s ease, border-color .18s ease; }
.product-card:hover { border-color: #a9cdcf; box-shadow: var(--shadow); }
.product-card > .product-art { min-height: 208px; }
.product-art { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 160px; background: #edf2f5; }
.product-art.mint { background: #eaf3ef; }
.product-art.blue { background: #edf2f9; }
.product-art.sand { background: #f6f1e9; }
.product-art.lilac { background: #f1eff7; }
.product-art > .badge { position: absolute; z-index: 2; left: 16px; top: 16px; }
.pack { position: relative; width: 132px; min-height: 100px; padding: 18px 12px 14px; overflow: hidden; border: 1px solid #d5dfe4; border-radius: 3px; color: var(--navy); background: #fff; box-shadow: 7px 10px 0 rgba(20, 45, 78, .05); transform: rotate(-6deg); }
.pack::before { content: "+"; position: absolute; top: 8px; right: 10px; color: var(--pack-color, var(--teal-dark)); font-size: 18px; }
.pack strong { display: block; max-width: 96px; margin-bottom: 5px; font-size: 15px; letter-spacing: -.5px; line-height: 1.15; }
.pack small { display: block; max-width: 100px; color: #526274; font-size: 7px; line-height: 1.4; }
.pack-band { height: 20px; margin: 12px -12px -14px; padding: 3px 12px; color: #fff; background: var(--pack-color, var(--teal-dark)); font-size: 7px; font-weight: 650; letter-spacing: 1px; }
.product-content, .product-card > .product-meta { padding: 20px; }
.product-meta { display: flex; flex-direction: column; gap: 10px; }
.product-meta .eyebrow { margin: 0; font-size: 9px; letter-spacing: 1px; }
.product-meta h3 { min-height: 44px; margin: 0; font-size: 16px; line-height: 1.4; }
.product-meta h3 a { color: var(--navy); }
.product-meta p { margin: 0; font-size: 12px; }
.product-meta .btn { margin-top: 4px; width: 100%; }
.price { color: var(--navy); font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
.price small { margin-left: 3px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; }
.product-subprice { color: var(--muted); font-size: 11px; }
.stock { display: inline-flex; align-items: center; gap: 6px; color: var(--success); font-size: 11px; font-weight: 600; }
.stock::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.stock.low { color: var(--warning); }
.stock.out { color: var(--danger); }
.product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
.product-detail > .product-art { min-height: 460px; border-radius: 16px; }
.product-detail > .product-art .pack { transform: rotate(-6deg) scale(1.8); }
.product-detail .price { margin: 16px 0 8px; font-size: 36px; }
.product-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 24px 0; }
.product-facts div { border-top: 1px solid var(--line); padding-top: 16px; }
.product-facts dt { color: var(--muted); font-size: 12px; }
.product-facts dd { margin: 4px 0 0; color: var(--navy); font-size: 14px; font-weight: 600; }

/* Composants, états et formulaires */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 11px 18px; border: 1px solid transparent; border-radius: 8px; color: var(--navy); background: #fff; font-size: 13px; font-weight: 650; line-height: 1.4; text-align: center; text-decoration: none !important; transition: background .16s ease, border-color .16s ease, box-shadow .16s ease; }
.btn.primary, .btn-primary { color: #fff; background: var(--teal-dark); border-color: var(--teal-dark); }
.btn.primary:hover, .btn-primary:hover { background: #095f61; border-color: #095f61; }
.btn.secondary, .btn-secondary { border-color: var(--line); color: var(--navy); background: #fff; }
.btn.secondary:hover, .btn-secondary:hover { border-color: #a7b9cb; background: #f4f7fa; }
.btn.ghost, .btn-ghost { color: var(--teal-dark); background: transparent; }
.btn.ghost:hover, .btn-ghost:hover { background: #e9f5f3; }
.btn.danger, .btn-danger { border-color: #f0c6cd; color: var(--danger); background: #fff2f4; }
.btn.danger:hover { background: #fce5e9; }
.btn.small, .btn-small { min-height: 44px; padding: 8px 12px; font-size: 12px; }
.btn.icon, .btn-icon { min-width: 44px; width: 44px; padding: 10px; }
.btn:disabled, .btn[aria-disabled="true"], .btn.is-disabled { color: #59697a; border-color: #dce3e9; background: #e8edf2; opacity: 1; pointer-events: none; }
.btn.is-loading::before { content: ""; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.badge { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; max-width: 100%; padding: 4px 9px; border: 1px solid transparent; border-radius: 5px; color: #45566c; background: #edf1f6; font-size: 10px; font-weight: 650; line-height: 1.5; white-space: nowrap; }
.badge.success { color: var(--success); border-color: #d6eadf; background: #eaf5ee; }
.badge.warning { color: var(--warning); border-color: #efdcb4; background: #fff4dd; }
.badge.danger { color: var(--danger); border-color: #f0d1d7; background: #fcedef; }
.badge.neutral { color: #4e6076; border-color: #dce4ec; background: #eef2f7; }
.badge.teal { color: var(--teal-dark); border-color: #cae4e2; background: #e7f4f2; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > label, .field > .label { color: var(--navy); font-size: 13px; font-weight: 600; }
.field label span { font-weight: 400; color: var(--muted); }
.field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #cdd8e3; border-radius: 8px; outline-offset: 2px; color: var(--ink); background: #fff; font-size: 14px; }
.field input::placeholder, .field textarea::placeholder { color: #6b7889; opacity: 1; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); }
.field textarea { min-height: 128px; resize: vertical; }
.field > small, .field .help { color: var(--muted); font-size: 11px; }
.field.is-error input, .field.is-error select, .field.is-error textarea, .field input[aria-invalid="true"] { border-color: var(--danger); background: #fffafb; }
.field.is-error > small, .field .error { color: var(--danger); }
.field.is-success input { border-color: var(--success); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap input { padding-right: 50px !important; }
.input-wrap .btn { position: absolute; right: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.form-grid .span-2, .form-grid > .full-width { grid-column: 1 / -1; }
.form-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 12px; padding-top: 24px; margin-top: 24px; border-top: 1px solid var(--line); }
.checkbox-line { display: flex; align-items: flex-start; gap: 10px; color: #526174; font-size: 13px; }
.checkbox-line input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--teal-dark); }
.panel { min-width: 0; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.panel-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.panel-title h2, .panel-title h3, h2.panel-title, h3.panel-title { margin-bottom: 0; }
.panel-title + p { color: var(--muted); }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.tabs button, .tabs a { min-height: 48px; padding: 12px 0; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: transparent; font-size: 13px; font-weight: 600; }
.tabs .is-active { color: var(--teal-dark); border-bottom-color: var(--teal-dark); }
.upload-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 184px; gap: 12px; padding: 24px; border: 1px dashed #acbdca; border-radius: 10px; color: var(--muted); background: #f8fafb; text-align: center; font-size: 12px; }
.upload-area svg { color: var(--teal-dark); width: 32px; height: 32px; }

/* Espaces fournisseur et administrateur */
.backoffice { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; display: flex; flex-direction: column; gap: 8px; align-self: start; height: 100vh; padding: 32px 20px 24px; border-right: 1px solid var(--line); background: #fff; }
.sidebar .logo { padding-inline: 8px; margin-bottom: 32px; }
.sidebar .eyebrow { padding-inline: 12px; margin-bottom: 8px; color: var(--muted); font-size: 9px; }
.sidebar-link { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 12px; border-radius: 8px; color: #586a80; font-size: 13px; font-weight: 550; text-decoration: none !important; }
.sidebar-link svg { width: 20px; height: 20px; }
.sidebar-link .badge { margin-left: auto; }
.sidebar-link:hover { color: var(--teal-dark); background: #f0f7f7; }
.sidebar-link.is-active { color: var(--teal-dark); background: #e8f4f2; font-weight: 650; }
.sidebar-footer { display: flex; flex-direction: column; gap: 16px; margin-top: auto; padding-top: 24px; border-top: 1px solid var(--line); }
.sidebar-footer .user-pill { padding-left: 0; border-left: 0; }
.backoffice-main { min-width: 0; padding: 32px 40px 48px; }
.backoffice-topbar { display: flex; justify-content: space-between; align-items: center; min-height: 40px; gap: 16px; margin-bottom: 32px; color: var(--muted); font-size: 12px; }
.backoffice-main .page-heading { margin-top: 0; }
.backoffice-main h1 { font-size: 30px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-bottom: 32px; }
.stat-card { min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.stat-card > .row { justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.stat-card .stat-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; color: var(--teal-dark); background: #eaf5f3; }
.stat-card p, .stat-card label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
.stat-card strong { display: block; margin: 8px 0; color: var(--navy); font-size: 32px; line-height: 1.15; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.stat-card small { color: var(--muted); font-size: 11px; }
.stat-card small.positive { color: var(--success); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.panel .table-wrap { border: 0; border-radius: 0; margin-inline: -4px; }
.data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
.data-table th { padding: 14px 16px; border-bottom: 1px solid var(--line); color: #5b6d82; background: #f7f9fb; font-size: 10px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
.data-table td { padding: 16px; border-bottom: 1px solid #e9eef3; color: #425369; vertical-align: middle; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #f9fbfc; }
.data-table td strong { display: block; color: var(--navy); font-size: 12px; font-weight: 650; }
.data-table td small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
.data-table .product-art { width: 48px; min-height: 48px; height: 48px; border-radius: 6px; }
.data-table .pack { width: 28px; min-height: 26px; padding: 4px; box-shadow: 2px 2px 0 rgba(20, 45, 78, .06); }
.data-table .pack strong { font-size: 4px; }
.data-table .pack small, .data-table .pack::before { display: none; }
.data-table .pack-band { height: 5px; padding: 0; margin: 5px -4px -4px; font-size: 0; }
.table-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.table-actions .btn { min-width: 44px; }
.table-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 20px 0 0; color: var(--muted); font-size: 12px; }
.pagination { display: flex; gap: 4px; }
.pagination .btn { min-width: 40px; min-height: 44px; padding: 8px; }
.pagination .is-active { color: var(--teal-dark); border-color: #c4e3e1; background: #e8f5f3; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 320px; padding: 48px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; text-align: center; }
.empty-state > svg { width: 48px; height: 48px; margin-bottom: 24px; padding: 10px; border-radius: 12px; color: var(--teal-dark); background: #e9f5f3; }
.empty-state p { max-width: 380px; margin-bottom: 24px; color: var(--muted); font-size: 14px; }

/* Panier, commande et suivi */
.cart-layout { display: grid; grid-template-columns: minmax(0, 1fr) 352px; align-items: start; gap: 32px; }
.cart-line { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto auto; gap: 24px; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--line); }
.cart-line:first-child { padding-top: 0; }
.cart-line:last-child { padding-bottom: 0; border-bottom: 0; }
.cart-line .product-art { min-height: 96px; border-radius: 8px; }
.cart-line .pack { transform: rotate(-5deg) scale(.55); flex-shrink: 0; }
.cart-line h3 { margin-bottom: 4px; font-size: 14px; }
.cart-line p { margin-bottom: 4px; color: var(--muted); font-size: 11px; }
.cart-line .price { font-size: 18px; white-space: nowrap; }
.quantity { display: inline-flex; align-items: center; width: fit-content; min-height: 44px; border: 1px solid #cdd8e3; border-radius: 8px; overflow: hidden; background: #fff; }
.quantity button { display: grid; place-items: center; width: 44px; min-height: 44px; padding: 0; border: 0; color: var(--navy); background: #fff; font-size: 18px; }
.quantity button:hover { background: #edf5f4; }
.quantity button:disabled { color: #8a97a5; background: #f5f7fa; }
.quantity input { width: 44px; height: 44px; padding: 0; border: 0; border-right: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 0; color: var(--navy); background: #fff; text-align: center; font-size: 13px; font-weight: 600; appearance: textfield; }
.quantity input::-webkit-inner-spin-button { appearance: none; }
.quantity.is-error { border-color: var(--danger); }
.summary { position: sticky; top: 24px; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.summary h2 { margin-bottom: 24px; font-size: 20px; }
.summary-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 14px 0; color: #536478; font-size: 13px; }
.summary-row strong { color: var(--navy); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.summary-row.total { padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--line); color: var(--navy); font-size: 15px; font-weight: 650; }
.summary-row.total strong { font-size: 25px; letter-spacing: -.5px; }
.summary .btn { width: 100%; margin-top: 16px; }
.summary > small { display: block; margin-top: 16px; color: var(--muted); font-size: 10px; text-align: center; }
.steps { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 32px 0 40px; }
.step { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.step::after { content: ""; width: 56px; height: 1px; margin-left: 16px; background: #cdd8e3; }
.step:last-child::after { display: none; }
.step > span:first-child { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid #cbd6e1; border-radius: 50%; color: #5e7188; background: #fff; font-size: 11px; font-weight: 650; }
.step.is-active { color: var(--teal-dark); font-weight: 650; }
.step.is-active > span:first-child, .step.is-complete > span:first-child { border-color: var(--teal-dark); color: #fff; background: var(--teal-dark); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item { position: relative; padding: 0 0 24px 32px; border-left: 1px solid #d6e1e7; }
.timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
.timeline-item::before { content: ""; position: absolute; top: 3px; left: -5px; width: 9px; height: 9px; border-radius: 50%; background: #b8c8d6; box-shadow: 0 0 0 4px #fff; }
.timeline-item.is-complete::before, .timeline-item.is-active::before { background: var(--teal-dark); }
.timeline-item.is-active::before { box-shadow: 0 0 0 4px #e0f1ee; }
.timeline-item strong { display: block; color: var(--navy); font-size: 13px; }
.timeline-item p, .timeline-item time { display: block; margin: 4px 0 0; color: var(--muted); font-size: 11px; }
.simulation-banner { display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border: 1px solid #e8d8b8; border-radius: 8px; color: #795319; background: #fff8e9; font-size: 12px; }
.simulation-banner svg { width: 18px; height: 18px; margin-top: 1px; }
.simulation-banner p { margin: 0; }
.notice { display: flex; gap: 12px; padding: 16px; border: 1px solid #cfe3e8; border-radius: 8px; color: #275568; background: #f0f8fa; font-size: 12px; }
.notice svg { width: 20px; height: 20px; }
.notice p { margin: 0; }
.notice.success { border-color: #cfe5d7; color: var(--success); background: #edf7f1; }
.notice.warning { border-color: #ecd8b4; color: var(--warning); background: #fff6e6; }
.notice.danger, .notice.error { border-color: #edcdd3; color: var(--danger); background: #fff0f3; }
.toast { position: fixed; z-index: 40; right: 32px; bottom: 32px; display: flex; align-items: flex-start; gap: 12px; width: min(400px, calc(100% - 32px)); padding: 20px; border: 1px solid #b9d9c6; border-radius: 10px; color: var(--success); background: #fff; box-shadow: 0 12px 32px rgba(20, 45, 78, .13); font-size: 13px; }
.toast > svg { width: 20px; height: 20px; }
.toast p { margin: 0; }
.toast .btn { margin: -10px -10px -10px auto; }
.modal-backdrop { position: fixed; z-index: 50; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(11, 30, 52, .5); }
.modal { width: min(480px, 100%); max-height: calc(100vh - 48px); overflow: auto; padding: 32px; border: 1px solid #dce4ec; border-radius: 16px; background: #fff; box-shadow: 0 24px 64px rgba(5, 28, 47, .16); }
.modal h2 { margin: 0 0 12px; font-size: 24px; }
.modal p { color: var(--muted); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
.confirmation-icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 50%; color: var(--success); background: #e5f4eb; }
.confirmation-icon svg { width: 30px; height: 30px; }
.confirmation-icon.danger { color: var(--danger); background: #fce9ed; }

/* Connexion et changement de mot de passe */
.login-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100vh; background: #fff; }
.login-brand { position: relative; display: flex; flex-direction: column; overflow: hidden; padding: 56px 64px; color: #d2e2ec; background: var(--navy); }

.login-brand h1 { max-width: 500px; margin-bottom: 24px; color: #fff; font-size: 46px; line-height: 1.12; letter-spacing: -1.9px; }

.login-brand p { max-width: 420px; color: #c2d4e0; font-size: 15px; }

.login-quote { position: relative; z-index: 2; padding-top: 24px; border-top: 1px solid #35516a; font-size: 12px; }
.login-quote p { margin-bottom: 8px; font-size: 13px; }
.login-quote small { color: #a7c0cf; font-size: 11px; }
.login-card { align-self: center; width: min(400px, calc(100% - 64px)); padding: 56px 0; margin-inline: auto; }
.login-card h1 { margin: 16px 0 12px; font-size: 32px; }
.login-card > p { margin-bottom: 32px; color: var(--muted); font-size: 14px; }
.login-card .field { margin-bottom: 20px; }
.login-card .btn.primary { width: 100%; margin-top: 8px; }
.login-card .form-actions { padding: 0; border: 0; }
.login-card .simulation-banner { margin-top: 24px; }
.demo-roles { padding-top: 24px; margin-top: 32px; border-top: 1px solid var(--line); }
.demo-roles > p { margin-bottom: 12px; color: var(--muted); font-size: 11px; }
.demo-roles .row { gap: 8px; }
.demo-roles .btn { flex: 1; padding-inline: 8px; font-size: 10px; }
.password-rules { display: flex; flex-direction: column; gap: 8px; padding: 0; list-style: none; color: var(--muted); font-size: 12px; }
.password-rules li { display: flex; align-items: center; gap: 8px; }
.password-rules .is-valid { color: var(--success); }

/* Page de présentation et bibliothèque de composants */
.cover { position: relative; overflow: hidden; padding: 64px; margin: 32px 0; border-radius: 20px; color: #cbdbe7; background: var(--navy); }
.cover .logo { margin-bottom: 64px; }
.cover .logo strong, .cover .logo small { color: #fff; }
.cover .logo-mark { border: 1px solid #5a8293; background: #21516a; color: #9be1db; }
.cover .eyebrow { color: #8bdbd4; }
.cover h1 { max-width: 840px; color: #fff; font-size: 60px; line-height: 1.06; letter-spacing: -2.8px; }
.cover p { max-width: 650px; color: #c0d3df; font-size: 17px; }
.cover .row { gap: 48px; margin-top: 48px; }
.cover-stat strong { display: block; color: #fff; font-size: 28px; letter-spacing: -1px; }
.cover-stat span { font-size: 11px; color: #afc8d7; }
.screen-directory { margin: 40px 0 64px; }
.screen-directory > p { color: var(--muted); }
.directory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.directory-card { display: flex; flex-direction: column; padding: 28px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: #fff; text-decoration: none !important; }
.directory-card:hover { border-color: #9cc7cb; }
.directory-card .eyebrow { font-size: 10px; }
.directory-card h3 { margin-bottom: 12px; }
.directory-card p { flex: 1; color: var(--muted); font-size: 13px; }
.directory-card > .row:last-child { justify-content: space-between; color: var(--teal-dark); font-size: 12px; font-weight: 650; }
.component-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.component-grid > .panel { display: flex; flex-direction: column; gap: 20px; }
.component-grid .panel-title { margin-bottom: 0; }
.color-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.swatch { min-height: 120px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.swatch-color { min-height: 80px; background: var(--swatch, var(--navy)); }
.swatch p { margin: 12px 12px 2px; color: var(--navy); font-size: 12px; font-weight: 600; }
.swatch code { display: block; margin: 0 12px 12px; color: var(--muted); font-size: 10px; }
.skeleton { min-height: 16px; border-radius: 6px; background: #e7edf2; animation: pulse 1.5s ease-in-out infinite alternate; }
.skeleton.card { min-height: 240px; }
.skeleton.short { width: 60%; }
.mobile-nav, .mobile-only { display: none; }
.footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 24px 0; margin-top: 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.footer a { color: var(--muted); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
