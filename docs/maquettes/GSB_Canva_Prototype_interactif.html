function filteredProducts(){let ps=state.products.filter(available).filter(p=>(!ui.cat||p.category===ui.cat)&&(!ui.lab||p.lab===ui.lab)&&(!ui.search||(p.name+' '+labName(p.lab)).toLowerCase().includes(ui.search.toLowerCase())));if(ui.sort==='price')ps.sort((a,b)=>a.price-b.price);if(ui.sort==='name')ps.sort((a,b)=>a.name.localeCompare(b.name));return ps;}
function catalogGrid(){let ps=filteredProducts();return ps.length?ps.map(productCard).join(''):empty('Aucun produit ne correspond à votre recherche.','Essayez un autre nom ou effacez vos filtres.',btn('Réinitialiser les filtres','reset-filters','secondary'));}
function catalog(){const ps=filteredProducts();return `<section class="hero"><div><p class="eyebrow">LE CATALOGUE DES LABORATOIRES PARTENAIRES</p><h1>Les essentiels du soin.<br>Un seul espace professionnel.</h1><p>Retrouvez vos produits, préparez vos commandes<br class="desktop-only"> et suivez chaque étape, simplement.</p><span class="hero-proof">${icon('shield',18)} Produits validés par GSB <span>·</span> Accès réservé aux professionnels</span></div><div class="hero-orbit" aria-hidden="true"><span class="orbit-ring"></span><span class="orbit-plus">+</span><div class="hero-pill"><span></span></div><span class="hero-dot"></span><span class="hero-orbit-label">GSB<br><small>À VOS CÔTÉS</small></span></div></section><div class="catalog-layout"><aside id="catalog-filters" class="filters ${ui.filtersOpen?'is-open':''}"><div class="row between"><h2>Affiner la sélection</h2><button class="btn icon ghost mobile-only" data-action="toggle-filters" aria-label="Fermer les filtres">${icon('close',18)}</button></div><label class="field"><span>Catégorie</span><select id="category-filter"><option value="">Toutes les catégories</option>${state.categories.filter(c=>c.active).map(c=>`<option value="${c.id}" ${ui.cat===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field"><span>Laboratoire</span><select id="lab-filter"><option value="">Tous les laboratoires</option>${state.labs.filter(l=>l.active).map(l=>`<option value="${l.id}" ${ui.lab===l.id?'selected':''}>${l.name}</option>`).join('')}</select></label>${btn('Effacer les filtres','reset-filters','ghost small')}<div class="filter-help">${icon('lab',26)}<h3>Un réseau de confiance</h3><p>Un laboratoire identifié pour chaque produit du catalogue.</p></div></aside><section class="catalog-results"><div class="toolbar"><button class="btn secondary mobile-only" data-action="toggle-filters" aria-controls="catalog-filters" aria-expanded="${ui.filtersOpen}">${icon('filter',18)} Filtres</button><div><h2>Notre catalogue</h2><p class="muted"><span id="result-count">${ps.length}</span> produits disponibles au catalogue</p></div><label class="search-field">${icon('search')}<input id="catalog-search" type="search" placeholder="Rechercher un produit, un laboratoire…" value="${esc(ui.search)}" aria-label="Rechercher au catalogue"></label><label class="sort-label"><span class="sr-only">Trier les produits</span><select id="sort-filter"><option value="default">Pertinence</option><option value="price" ${ui.sort==='price'?'selected':''}>Prix croissant</option><option value="name" ${ui.sort==='name'?'selected':''}>Nom du produit</option></select></label></div><div class="chips"><button class="chip ${!ui.cat?'is-active':''}" data-action="category" data-id="">Tout le catalogue</button>${state.categories.filter(c=>c.active).map(c=>`<button class="chip ${ui.cat===c.id?'is-active':''}" data-action="category" data-id="${c.id}">${c.name}</button>`).join('')}</div><div class="product-grid" id="product-grid">${catalogGrid()}</div><p class="catalog-note muted">Les prix affichés et les stocks sont des données fictives de démonstration.</p></section></div>`;}
function productDetail(id){const p=product(id)||state.products[0];return `<div class="breadcrumb"><a href="#catalogue">Catalogue</a>${icon('chevron',14)}<span>${catName(p.category)}</span>${icon('chevron',14)}<span>${esc(p.name)}</span></div><div class="product-detail-grid"><div>${pack(p,true)}<div class="notice section-gap">${icon('lab')}<span>Visuel et produit fictifs · Maquette pédagogique GSB</span></div></div><section class="product-detail-content"><p class="eyebrow">${esc(labName(p.lab))}</p><h1>${esc(p.name)}</h1><p class="muted">${esc(p.format)} · Référence ${esc(p.code)}</p><div class="row section-gap">${badge(p.stock?'Accepté':'Indisponible')}<span class="muted">${p.stock?'Produit validé par GSB':'Réapprovisionnement à venir'}</span></div><p class="product-description">${esc(p.description)}</p><div class="detail-price"><strong>${money(p.price)} <small>HT / unité</small></strong><span>${money(p.price*(1+p.tva/100))} TTC · TVA ${p.tva} %</span></div><div class="stock-line">${p.stock?`${icon('check',16)} En stock — ${p.stock} unités disponibles`:'Rupture de stock'}</div><div class="row section-gap"><div class="quantity"><button data-action="detail-qty" data-delta="-1" aria-label="Diminuer la quantité">${icon('minus',16)}</button><output id="detail-qty">${ui.qty}</output><button data-action="detail-qty" data-delta="1" data-id="${p.id}" aria-label="Augmenter la quantité">${icon('plus',16)}</button></div>${btn(icon('cart')+' Ajouter au panier','add-cart','primary',`data-id="${p.id}" data-detail="1" ${p.stock?'':'disabled'}`)}</div><p class="muted">Quantité minimale : 1 · Maximum : stock disponible.</p><div class="panel section-gap"><div class="summary-row"><span>Laboratoire fournisseur</span><strong>${labName(p.lab)}</strong></div><div class="summary-row"><span>Catégorie</span><strong>${catName(p.category)}</strong></div><div class="summary-row"><span>Conditionnement</span><strong>${esc(p.format)}</strong></div></div></section></div>`;}
function empty(title,description,action=''){return `<div class="empty-state">${icon('box',44)}<h2>${title}</h2><p>${description}</p>${action}</div>`;}
function summary(lines,action=''){const t=totals(lines);return `<aside class="panel summary"><h2>Votre récapitulatif</h2><p class="muted">${lines.reduce((n,l)=>n+l.qty,0)} articles · ${lines.length} références</p><div class="summary-row"><span>Total HT</span><strong>${money(t.ht)}</strong></div><div class="summary-row"><span>TVA</span><strong>${money(t.tva)}</strong></div><div class="summary-row total"><span>Total TTC</span><strong>${money(t.ttc)}</strong></div>${action}<p class="muted summary-note">${icon('shield',16)} Paiement et livraison simulés</p></aside>`;}
function cart(){const lines=cartLines();return heading('Votre panier','Retrouvez les produits sélectionnés. Votre panier est conservé dans cette démonstration.',link('Continuer mes achats','catalogue','ghost'))+(lines.length?`<div class="cart-layout"><section><div class="panel">${lines.map(l=>`<article class="cart-line"><div class="cart-thumb">${pack(l)}</div><div><p class="product-meta">${labName(l.lab)}</p><h3>${esc(l.name)}</h3><p class="muted">${esc(l.format)}</p><strong>${money(l.price)} HT / unité</strong></div><div class="quantity"><button data-action="cart-qty" data-id="${l.id}" data-delta="-1" aria-label="Diminuer ${esc(l.name)}">${icon('minus',16)}</button><output>${l.qty}</output><button data-action="cart-qty" data-id="${l.id}" data-delta="1" aria-label="Augmenter ${esc(l.name)}">${icon('plus',16)}</button></div><div class="text-right"><strong>${money(l.price*l.qty)} HT</strong><p class="muted">${money(l.price*l.qty*(1+l.tva/100))} TTC</p></div><button class="btn icon ghost" data-action="remove-cart" data-id="${l.id}" aria-label="Retirer ${esc(l.name)}">${icon('trash',18)}</button></article>`).join('')}</div><div class="notice section-gap">${icon('clock')}<span>Le prix et la disponibilité sont vérifiés avant la création de votre commande.</span></div></section>${summary(lines,link('Valider mon panier '+icon('arrow',18),'validation','primary full-width'))}</div>`:empty('Votre panier attend vos essentiels.','Parcourez le catalogue pour ajouter votre premier produit.',link('Découvrir le catalogue','catalogue','primary')));}
const steps=current=>`<ol class="steps">${['Panier','Coordonnées','Paiement simulé','Confirmation'].map((s,i)=>`<li class="step ${i<=current?'is-active':''}"><span>${i<current?icon('check',14):i+1}</span>${s}</li>`).join('')}</ol>`;
const field=(label,name,value='',type='text',extra='')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
function checkout(){const lines=cartLines();if(!lines.length)return empty('Ajoutez d’abord un produit au panier.','Une commande doit contenir au moins une ligne.',link('Retour au catalogue','catalogue','primary'));return steps(1)+heading('Vérifiez votre commande','Une dernière vérification avant la simulation du paiement.')+`<form id="checkout-form" class="cart-layout"><div class="panel"><h2>Vos coordonnées</h2><p class="muted">Professionnelle de santé · données de démonstration</p><div class="form-grid section-gap">${field('Prénom *','first',state.profile.first,'text','required')}${field('Nom *','last',state.profile.last,'text','required')}${field('Email professionnel *','email',state.profile.email,'email','required')}${field('Téléphone','phone',state.profile.phone,'tel')}</div><h2 class="section-gap">Adresse de livraison fictive</h2>${field('Adresse *','address',state.profile.address,'text','required')}<div class="form-grid">${field('Code postal *','postal',state.profile.postal,'text','required pattern="[0-9]{5}"')}${field('Ville *','city',state.profile.city,'text','required')}</div><label class="checkbox-label"><input type="checkbox" required checked> J’ai vérifié les produits, les quantités et l’adresse fictive.</label><div class="notice section-gap">${icon('lab')}<span>Aucune expédition réelle. Les données de cette maquette sont fictives.</span></div></div>${summary(lines,'<button class="btn primary full-width" type="submit">Passer au paiement simulé '+icon('arrow',18)+'</button>')}</form>`;}
function payment(id){const o=order(id);return steps(2)+heading('Paiement simulé','Choisissez une issue pour tester le parcours de démonstration.')+`<div class="center-column">${simulation('Simulation — aucun paiement réel. Aucune donnée bancaire n’est demandée.')}<div class="panel payment-panel"><span class="payment-icon">${icon('shield',36)}</span><p class="eyebrow">COMMANDE ${o.reference}</p><h2>${money(totals(o.lines).ttc)}</h2><p class="muted">Montant TTC de la commande fictive</p>${o.payment?`<div class="section-gap">${badge(o.payment.status)}<p>Un résultat de paiement a déjà été enregistré pour cette commande.</p>${link('Consulter ma commande','commande/'+o.id,'primary')}</div>`:`<div class="payment-choices section-gap">${btn(icon('check')+' Simuler une réussite','pay-success','primary',`data-id="${o.id}"`)}${btn(icon('close')+' Simuler un échec','pay-fail','secondary',`data-id="${o.id}"`)}</div><p class="muted section-gap">Une seule simulation sera enregistrée pour cette commande.</p>`}</div></div>`;}
function confirmation(id){const o=order(id),ok=o.payment?.status==='Réussi';return steps(3)+`<div class="confirmation panel"><span class="confirmation-symbol ${ok?'success':'danger'}">${icon(ok?'check':'alert',38)}</span><p class="eyebrow">${ok?'VOTRE COMMANDE EST ENREGISTRÉE':'LE PAIEMENT SIMULÉ A ÉCHOUÉ'}</p><h1>${ok?'Merci pour votre commande.':'Votre commande reste en attente.'}</h1><p class="muted">${ok?'Vous pouvez retrouver ses détails et son suivi dans votre espace.':'Le résultat fictif est conservé. Aucun paiement réel n’a été effectué.'}</p><div class="confirmation-reference"><span>Référence</span><strong>${o.reference}</strong><span>Total TTC</span><strong>${money(totals(o.lines).ttc)}</strong></div><div class="row center">${link('Voir ma commande '+icon('arrow',18),'commande/'+o.id,'primary')}${link('Retour au catalogue','catalogue','secondary')}</div></div>`;}
function ordersTable(admin=false){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Commande</th><th>Date</th><th>${admin?'Professionnel':'Articles'}</th><th>Total TTC</th><th>Statut</th><th></th></tr></thead><tbody>${state.orders.map(o=>`<tr><td data-label="Commande"><strong>${o.reference}</strong><small>${o.payment?'Paiement '+o.payment.status.toLowerCase():'Paiement non simulé'}</small></td><td data-label="Date">${shortDate(o.date)}</td><td data-label="${admin?'Professionnel':'Articles'}">${admin?'Dr Lina Martin':o.lines.reduce((n,l)=>n+l.qty,0)+' articles'}</td><td data-label="Total TTC"><strong>${money(totals(o.lines).ttc)}</strong></td><td data-label="Statut">${badge(o.status)}</td><td><a class="btn ghost small" href="#${admin?'admin/commande/':'commande/'}${o.id}">Voir ${icon('chevron',16)}</a></td></tr>`).join('')}</tbody></table></div>`;}
function orders(admin=false){return heading(admin?'Commandes & livraisons':'Mes commandes',admin?'Consultez les commandes et faites évoluer leur suivi fictif.':'Vos commandes, leur historique et leur livraison au même endroit.')+`<section class="panel"><div class="toolbar"><h2>${state.orders.length} commandes</h2><span class="badge neutral">Tous les statuts</span></div>${state.orders.length?ordersTable(admin):empty('Vous n’avez pas encore de commande.','Votre première commande apparaîtra ici.',link('Parcourir le catalogue','catalogue','primary'))}</section>`;}
function orderDetail(id,admin=false){const o=order(id),t=totals(o.lines);return `<div class="breadcrumb"><a href="#${admin?'admin/commandes':'commandes'}">Commandes</a>${icon('chevron',14)}${o.reference}</div>`+heading(o.reference,`Commande du ${shortDate(o.date)} · ${o.lines.length} références`,badge(o.status))+`${admin?`<section class="panel section-gap"><div class="row between"><div><h2>Faire évoluer la commande</h2><p class="muted">Chaque changement est conservé dans l’historique.</p></div><div class="row"><select id="admin-order-status" aria-label="Nouveau statut">${['En attente','Validée','Annulée'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>${btn('Mettre à jour','order-status','primary',`data-id="${o.id}"`)}</div></div></section>`:''}<div class="cart-layout"><div class="stack"><section class="panel"><div class="row between"><h2>Les produits de votre commande</h2><span class="badge neutral">Prix figés à l’achat</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Produit</th><th>Quantité</th><th>Prix HT / unité</th><th>TVA</th><th>Total TTC</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td data-label="Produit"><strong>${esc(l.name)}</strong><small>Libellé conservé à l’achat</small></td><td data-label="Quantité">${l.qty}</td><td data-label="Prix HT / unité">${money(l.price)}</td><td data-label="TVA">${l.tva} %</td><td data-label="Total TTC"><strong>${money(l.price*l.qty*(1+l.tva/100))}</strong></td></tr>`).join('')}</tbody></table></div><p class="muted">Les évolutions du catalogue ne modifient pas ces prix ni ces libellés.</p></section><section class="panel"><h2>Historique de la commande</h2><ol class="timeline">${o.history.map((h,i)=>`<li class="timeline-item"><span class="timeline-dot">${icon('check',14)}</span><div><strong>${h.status}</strong><p class="muted">${shortDate(h.date)} · ${new Date(h.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</p></div></li>`).join('')}</ol></section><section class="panel"><div class="row between"><h2>Livraison fictive</h2>${o.delivery?badge(o.delivery.status):'<span class="badge neutral">Non créée</span>'}</div>${o.delivery?`<p class="muted">Suivi : <strong>${o.delivery.tracking}</strong></p><div class="delivery-steps">${['En préparation','Expédiée','Livrée'].map((s,i)=>`<span class="${i<=['En préparation','Expédiée','Livrée'].indexOf(o.delivery.status)?'is-active':''}">${icon(i===0?'box':i===1?'truck':'check',18)}${s}</span>`).join('')}</div><p class="muted">${o.delivery.shipped?'Expédition simulée le '+shortDate(o.delivery.shipped):'En attente d’expédition simulée.'}${o.delivery.delivered?' · Livraison simulée le '+shortDate(o.delivery.delivered):''}</p>`:'<p class="muted">Le suivi apparaîtra lorsqu’une livraison fictive sera créée.</p>'}${admin?`<div class="row section-gap"><select id="delivery-status" aria-label="Statut de livraison fictive">${['En préparation','Expédiée','Livrée'].map(s=>`<option ${o.delivery?.status===s?'selected':''}>${s}</option>`).join('')}</select>${btn(o.delivery?'Actualiser le suivi':'Créer la livraison fictive','delivery-update','secondary',`data-id="${o.id}"`)}</div>`:''}</section></div><aside class="stack"><section class="panel summary"><h2>Récapitulatif</h2><div class="summary-row"><span>Total HT</span><strong>${money(t.ht)}</strong></div><div class="summary-row"><span>TVA</span><strong>${money(t.tva)}</strong></div><div class="summary-row total"><span>Total TTC</span><strong>${money(t.ttc)}</strong></div><h3 class="section-gap">Paiement simulé</h3>${o.payment?badge(o.payment.status):'<span class="badge neutral">Non simulé</span>'}<p class="muted">${o.payment?o.payment.reference:'Aucun résultat enregistré.'}</p><p class="muted">Aucun paiement réel.</p></section><section class="panel"><h2>Adresse fictive</h2><p>Dr Lina Martin</p><p class="muted">${esc(o.address)}</p></section></aside></div>`;}
function account(){const p=state.profile;return heading('Mon compte','Vos informations professionnelles et vos coordonnées.')+`<form id="profile-form" class="panel account-panel"><div class="row"><span class="avatar large">LM</span><div><h2>Dr ${esc(p.name)}</h2><p class="muted">Professionnelle de santé · compte actif</p></div>${badge('Actif')}</div><h3 class="section-gap">Informations personnelles</h3><div class="form-grid">${field('Prénom *','first',p.first,'text','required')}${field('Nom *','last',p.last,'text','required')}${field('Email professionnel *','email',p.email,'email','required')}${field('Téléphone','phone',p.phone,'tel')}</div><h3 class="section-gap">Profil professionnel</h3><div class="form-grid">${field('Profession *','profession',p.profession,'text','required')}${field('Numéro professionnel *','number',p.number,'text','required')}</div><h3 class="section-gap">Adresse de l’établissement</h3>${field('Adresse *','address',p.address,'text','required')}<div class="form-grid">${field('Code postal *','postal',p.postal,'text','required pattern="[0-9]{5}"')}${field('Ville *','city',p.city,'text','required')}</div><div class="row end section-gap"><button class="btn primary" type="submit">Enregistrer les modifications</button></div></form>`;}
function login(password=false){return `<main class="login-layout" id="main"><section class="login-brand">${logo()}<div class="login-brand-content"><p class="eyebrow">LE LIEN ENTRE LABORATOIRES ET SOIGNANTS</p><h1>Votre quotidien,<br>en toute confiance.</h1><p>Une plateforme pensée pour les professionnels de santé et les laboratoires partenaires.</p><div class="login-visual" aria-hidden="true"><span class="login-cross">+</span><span class="login-circle"></span><div class="login-mini-card">${icon('shield',28)}<strong>Un espace professionnel.<br>Un réseau de confiance.</strong></div></div></div><p class="login-brand-foot">GSB · Projet pédagogique BTS SIO SLAM</p></section><section class="login-card"><a class="login-back" href="#presentation">${icon('chevron',16)} Voir la présentation</a><div><span class="badge neutral">${icon('lock',14)} ${password?'PREMIÈRE CONNEXION':'ACCÈS PROFESSIONNEL'}</span><h2>${password?'Un nouveau départ sécurisé.':'Bienvenue dans votre espace.'}</h2><p class="muted">${password?'Définissez un nouveau mot de passe pour continuer la démonstration.':'Connectez-vous pour retrouver vos produits et vos commandes.'}</p>${password?`<form id="password-form">${field('Nouveau mot de passe *','password','DemoGSB!2026','password','required minlength="8" autocomplete="new-password"')}${field('Confirmer le mot de passe *','confirm','DemoGSB!2026','password','required minlength="8" autocomplete="new-password"')}<p class="muted">Au moins 8 caractères. Utilisez uniquement une valeur fictive dans cette maquette.</p><p class="form-error" id="password-error" role="alert"></p><button class="btn primary full-width" type="submit">Enregistrer et continuer ${icon('arrow',18)}</button></form>`:`<form id="login-form">${field('Email professionnel *','email',ui.loginRole==='admin'?'admin@gsb.exemple.test':ui.loginRole==='fournisseur'?'camille@aster.exemple.test':'lina.martin@exemple.test','email','required autocomplete="username"')}<label class="field"><span>Mot de passe *</span><span class="password-input"><input name="password" type="password" value="DemoGSB!2026" required autocomplete="current-password"><button class="btn icon ghost" data-action="toggle-password" type="button" aria-label="Afficher le mot de passe">${icon('eye',18)}</button></span></label><p class="muted">Compte fictif prérempli pour explorer le prototype.</p><button class="btn primary full-width" type="submit">Se connecter ${icon('arrow',18)}</button></form><div class="demo-roles"><p class="eyebrow">CHOISIR UN PARCOURS DE DÉMONSTRATION</p><div class="row">${[['professionnel','Professionnel'],['fournisseur','Fournisseur'],['admin','Administrateur']].map(([r,label])=>btn(label,'demo-role',ui.loginRole===r?'secondary is-active small':'ghost small',`data-role="${r}"`)).join('')}</div></div>`}<div class="notice section-gap">${icon('shield',18)}<span>Démonstration pédagogique. N’utilisez aucune donnée personnelle réelle.</span></div></div><p class="muted login-copyright">© 2026 GSB · IPSSI Paris</p></section></main>`;}
function stats(items){return `<div class="stat-grid">${items.map(([n,l,sub,i])=>`<article class="stat-card"><div class="row between"><span class="muted">${l}</span><span class="stat-icon">${icon(i||'box')}</span></div><strong>${n}</strong><p class="muted">${sub}</p></article>`).join('')}</div>`;}
function productsTable(ps,admin=false){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Produit</th><th>${admin?'Laboratoire':'Catégorie'}</th><th>Prix HT</th><th>Stock fictif</th><th>Validation</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td data-label="Produit"><div class="table-product"><span class="mini-pack" style="--pack-color:${p.color}">${icon('box',19)}</span><div><strong>${esc(p.name)}</strong><small>${esc(p.code)} · ${esc(p.format)}</small></div></div></td><td data-label="${admin?'Laboratoire':'Catégorie'}">${admin?labName(p.lab):catName(p.category)}</td><td data-label="Prix HT"><strong>${money(p.price)}</strong></td><td data-label="Stock fictif"><span class="${p.stock<10?'stock-warning':''}">${p.stock} unités</span></td><td data-label="Validation">${badge(p.status)}</td><td class="table-actions"><a class="btn ghost small" href="#${admin?'admin/examen/':'fournisseur/modifier/'}${p.id}">${admin?'Examiner':'Modifier'} ${icon('chevron',16)}</a></td></tr>`).join('')}</tbody></table></div>`;}
function supplierDashboard(){const ps=state.products.filter(p=>p.lab===state.labId),pending=ps.filter(p=>p.status==='En attente'),low=ps.filter(p=>p.stock<10);return heading('Bonjour '+esc((sessionUser()?.name||'Camille').split(' ')[0])+',','Voici l’activité de votre laboratoire aujourd’hui.',link(icon('plus',18)+' Ajouter un produit','fournisseur/ajouter','primary'))+simulation('Stock fictif — aucun mouvement réel de marchandise.')+stats([[ps.length,'Mes produits','Rattachés à votre laboratoire','box'],[pending.length,'En attente','Soumis à la validation GSB','clock'],[low.length,'Stock à surveiller','Moins de 10 unités fictives','alert']])+`<section class="panel"><div class="row between"><div><h2>Vos produits récents</h2><p class="muted">Suivez leur validation et leur disponibilité.</p></div>${link('Tous mes produits','fournisseur/produits','ghost')}</div>${productsTable(ps.slice().reverse().slice(0,4))}</section><div class="grid-2 section-gap"><section class="panel"><span class="badge warning">À VÉRIFIER</span><h2 class="section-gap">${low.length} alerte de stock fictif</h2><p class="muted">Ajustez vos quantités et conservez le motif de chaque mouvement.</p>${link('Gérer mon stock','fournisseur/stock','secondary')}</section><section class="panel"><span class="badge neutral">COMMENT ÇA MARCHE ?</span><h2 class="section-gap">De la soumission au catalogue</h2><p class="muted">Votre produit est examiné par GSB. Une fois accepté et actif, il devient visible aux professionnels de santé.</p></section></div>`;}
function supplierProducts(){const ps=state.products.filter(p=>p.lab===state.labId&&(!ui.status||p.status===ui.status)&&(!ui.tableSearch||p.name.toLowerCase().includes(ui.tableSearch.toLowerCase())));return heading('Mes produits','Votre catalogue et les décisions de validation GSB.',link(icon('plus',18)+' Ajouter un produit','fournisseur/ajouter','primary'))+`<section class="panel"><div class="toolbar"><label class="search-field">${icon('search')}<input id="table-search" placeholder="Rechercher dans mes produits" value="${esc(ui.tableSearch)}"></label><select id="product-status-filter" aria-label="Filtrer par validation"><option value="">Tous les statuts</option>${['En attente','Accepté','Refusé'].map(s=>`<option ${ui.status===s?'selected':''}>${s}</option>`).join('')}</select><span class="muted">${ps.length} produits</span></div>${ps.length?productsTable(ps):empty('Aucun produit dans cette sélection.','Ajoutez votre premier produit ou changez les filtres.',link('Ajouter un produit','fournisseur/ajouter','primary'))}</section>`;}
function productForm(id){const p=id?product(id):null;if(p&&p.lab!==state.labId)return empty('Ce produit appartient à un autre laboratoire.','Votre compte donne accès uniquement à vos propres produits.',link('Mes produits','fournisseur/produits'));return `<div class="breadcrumb"><a href="#fournisseur/produits">Mes produits</a>${icon('chevron',14)}${p?'Modifier':'Ajouter un produit'}</div>`+heading(p?'Modifier le produit':'Un nouveau produit, en quelques étapes.','Renseignez sa présentation, son prix et son stock fictif.')+`<form id="product-form" data-id="${p?.id||''}" class="cart-layout"><section class="panel"><h2>Présentation du produit</h2>${field('Nom du produit *','name',p?.name||'Solution essentielle Aster','text','required')}<label class="field"><span>Description *</span><textarea name="description" required rows="4">${esc(p?.description||'Produit fictif du laboratoire Aster, destiné à la démonstration de la boutique GSB.')}</textarea></label><div class="form-grid"><label class="field"><span>Catégorie *</span><select name="category" required>${state.categories.filter(c=>c.active).map(c=>`<option value="${c.id}" ${p?.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>${field('Conditionnement','format',p?.format||'Flacon · 100 ml')}</div>${field('URL du visuel fictif','image_url',p?.image_url||'','url','placeholder="https://…"')}<h3 class="section-gap">Tarification et disponibilité</h3><div class="form-grid">${field('Prix HT unitaire (€) *','price',p?.price||14.90,'number','required min="0" step="0.01"')}${field('Taux de TVA (%) *','tva',p?.tva??20,'number','required min="0" max="100" step="0.01"')}${field('Stock fictif initial *','stock',p?.stock??40,'number',`required min="0" step="1" ${p?'readonly':''}`)}</div>${p?'<p class="muted">Pour conserver la traçabilité, ajustez le stock depuis l’écran Stock fictif.</p>':''}<label class="checkbox-label"><input name="active" type="checkbox" ${p?.active===false?'':'checked'}> Produit actif après validation par GSB</label><div class="row end section-gap">${link('Annuler','fournisseur/produits','secondary')}<button class="btn primary" type="submit">${p?'Enregistrer et soumettre':'Soumettre à GSB'} ${icon('arrow',18)}</button></div></section><aside class="stack"><section class="panel"><p class="eyebrow">VOTRE LABORATOIRE</p><h2>${labName(state.labId)}</h2><p class="muted">Ce rattachement est déterminé par votre compte et ne peut pas être modifié.</p></section><section class="panel"><h3>Après la soumission</h3>${badge('En attente')}<p class="muted">L’administrateur examinera votre produit. Il sera proposé au catalogue uniquement lorsqu’il sera accepté et actif.</p></section>${simulation('Les quantités saisies sont fictives.')}</aside></form>`;}
function stock(){const ps=state.products.filter(p=>p.lab===state.labId),ms=state.movements.filter(m=>ps.some(p=>p.id===m.product));return heading('Stock fictif','Chaque variation est conservée avec sa date et son motif.')+simulation('Simulation de stock — aucune marchandise réelle.')+`<div class="cart-layout"><section class="panel"><h2>Historique des mouvements</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Produit</th><th>Variation</th><th>Motif</th><th>Date</th></tr></thead><tbody>${ms.map(m=>`<tr><td data-label="Produit"><strong>${esc(product(m.product)?.name)}</strong></td><td data-label="Variation"><span class="badge ${m.variation>0?'success':'neutral'}">${m.variation>0?'+':''}${m.variation}</span></td><td data-label="Motif">${esc(m.motif)}</td><td data-label="Date">${shortDate(m.date)}</td></tr>`).join('')}</tbody></table></div>${ms.length?'':'<p class="muted">Aucun mouvement enregistré.</p>'}</section><form class="panel" id="stock-form"><h2>Enregistrer un mouvement</h2><label class="field"><span>Produit *</span><select name="product" required>${ps.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock})</option>`).join('')}</select></label>${field('Variation de quantité *','variation',10,'number','required step="1"')}<p class="muted">Nombre positif pour ajouter, négatif pour retirer.</p>${field('Motif *','motif','Réapprovisionnement fictif','text','required')}<p class="form-error" id="stock-error" role="alert"></p><button class="btn primary full-width" type="submit">Enregistrer la variation</button></form></div>`;}
function adminDashboard(){const pending=state.products.filter(p=>p.status==='En attente');return heading('Vue d’ensemble','Les informations essentielles pour piloter la plateforme.',link('Voir le catalogue professionnel','catalogue','secondary'))+stats([[pending.length,'Produits à valider','Nouvelles soumissions partenaires','clock'],[state.labs.length,'Laboratoires partenaires','Chacun dispose d’un compte','lab'],[state.users.length,'Comptes utilisateurs','Professionnels et partenaires','user'],[state.orders.filter(o=>o.status==='En attente').length,'Commandes en attente','Suivi et validation','orders']])+`<section class="panel"><div class="row between"><div><h2>Votre file de validation</h2><p class="muted">Ces produits attendent une décision avant leur publication.</p></div>${link('Tout examiner','admin/validation','ghost')}</div>${pending.length?productsTable(pending.slice(0,3),true):empty('Tout est à jour.','Aucun produit ne nécessite de validation pour le moment.')}</section><section class="panel section-gap"><div class="row between"><h2>Dernières commandes</h2>${link('Toutes les commandes','admin/commandes','ghost')}</div>${ordersTable(true)}</section>`;}
function adminValidation(){const ps=state.products.filter(p=>!ui.status||p.status===ui.status);return heading('Validation des produits','Examinez les soumissions des laboratoires partenaires.')+`<section class="panel"><div class="toolbar"><h2>${ps.length} produits à consulter</h2><select id="product-status-filter" aria-label="Statut du produit"><option value="">Tous les statuts</option>${['En attente','Accepté','Refusé'].map(s=>`<option ${ui.status===s?'selected':''}>${s}</option>`).join('')}</select></div>${productsTable(ps,true)}</section>`;}
function adminExamine(id){const p=product(id)||state.products.find(p=>p.status==='En attente')||state.products[0];return `<div class="breadcrumb"><a href="#admin/validation">Validation des produits</a>${icon('chevron',14)}Examen</div>`+heading('Examiner le produit',`${labName(p.lab)} · Référence ${p.code}`,badge(p.status))+`<div class="cart-layout"><section class="panel"><div class="review-grid">${pack(p,true)}<div><p class="eyebrow">${catName(p.category)}</p><h2>${esc(p.name)}</h2><p class="muted">${esc(p.format)}</p><p>${esc(p.description)}</p><div class="summary-row"><span>Prix HT</span><strong>${money(p.price)}</strong></div><div class="summary-row"><span>TVA</span><strong>${p.tva} %</strong></div><div class="summary-row"><span>Prix TTC</span><strong>${money(p.price*(1+p.tva/100))}</strong></div><div class="summary-row"><span>Stock fictif</span><strong>${p.stock} unités</strong></div></div></div></section><aside class="stack"><section class="panel"><h2>Votre décision</h2><p class="muted">Un produit accepté et actif devient visible dans le catalogue professionnel.</p>${btn(icon('check')+' Accepter le produit','accept-product','primary full-width',`data-id="${p.id}"`)}${btn(icon('close')+' Refuser le produit','reject-product','secondary full-width',`data-id="${p.id}"`)}<a class="btn ghost full-width" href="#admin/validation">Revenir à la liste</a></section><section class="panel"><h3>Laboratoire fournisseur</h3><p>${labName(p.lab)}</p><p class="muted">Un seul laboratoire est associé à ce produit.</p></section></aside></div>`;}
function adminUsers(){return heading('Comptes utilisateurs','Gérez les rôles, les rattachements et l’activation des comptes.',btn(icon('plus',18)+' Ajouter un compte','new-user','primary'))+`<section class="panel"><div class="toolbar"><h2>${state.users.length} comptes</h2><span class="badge neutral">Comptes fictifs</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Laboratoire</th><th>Statut</th><th></th></tr></thead><tbody>${state.users.map(u=>`<tr><td data-label="Utilisateur"><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></td><td data-label="Rôle">${u.role}</td><td data-label="Laboratoire">${u.lab?labName(u.lab):'—'}</td><td data-label="Statut">${badge(u.active?'Actif':'Inactif')}</td><td>${btn(u.active?'Désactiver':'Activer','toggle-user','ghost small',`data-id="${u.id}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function adminLabs(){return heading('Laboratoires partenaires','Chaque laboratoire dispose d’au moins un compte fournisseur.',btn(icon('plus',18)+' Ajouter un laboratoire','new-lab','primary'))+`<div class="grid-3">${state.labs.map(l=>`<section class="panel lab-card"><span class="lab-symbol" style="color:${l.color}">${icon('lab',32)}</span><h2>${esc(l.name)}</h2><p class="muted">${esc(l.email)}</p>${badge(l.active?'Actif':'Inactif')}<h3 class="section-gap">Comptes associés</h3>${state.users.filter(u=>u.lab===l.id).map(u=>`<div class="row lab-user"><span class="avatar">${esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><div><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></div></div>`).join('')}${btn(l.active?'Désactiver le laboratoire':'Activer le laboratoire','toggle-lab','secondary full-width',`data-id="${l.id}"`)}</section>`).join('')}</div>`;}
function adminCategories(){return heading('Catégories','Organisez les produits du catalogue professionnel.',btn(icon('plus',18)+' Ajouter une catégorie','new-category','primary'))+`<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Catégorie</th><th>Produits</th><th>Statut</th><th></th></tr></thead><tbody>${state.categories.map(c=>`<tr><td data-label="Catégorie"><div class="table-product"><span class="stat-icon">${icon('tag')}</span><strong>${esc(c.name)}</strong></div></td><td data-label="Produits">${state.products.filter(p=>p.category===c.id).length}</td><td data-label="Statut">${badge(c.active?'Actif':'Inactif')}</td><td class="table-actions">${btn('Modifier','edit-category','ghost small',`data-id="${c.id}"`)}${btn(c.active?'Désactiver':'Activer','toggle-category','ghost small',`data-id="${c.id}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
const screenList=[['connexion','Connexion','Parcours commun'],['mot-de-passe','Première connexion','Parcours commun'],['catalogue','Catalogue','Professionnel'],['produit/p1','Fiche produit','Professionnel'],['panier','Panier persistant','Professionnel'],['validation','Coordonnées & validation','Professionnel'],['paiement/o1','Paiement simulé','Professionnel'],['confirmation/o1','Confirmation','Professionnel'],['commandes','Mes commandes','Professionnel'],['commande/o1','Détail de commande','Professionnel'],['compte','Mon compte','Professionnel'],['fournisseur','Tableau de bord','Fournisseur'],['fournisseur/produits','Mes produits','Fournisseur'],['fournisseur/ajouter','Ajouter un produit','Fournisseur'],['fournisseur/modifier/p1','Modifier un produit','Fournisseur'],['fournisseur/stock','Stock fictif','Fournisseur'],['admin','Supervision','Administration'],['admin/validation','Validation des produits','Administration'],['admin/examen/p7','Examen d’un produit','Administration'],['admin/comptes','Comptes utilisateurs','Administration'],['admin/laboratoires','Laboratoires','Administration'],['admin/categories','Catégories','Administration'],['admin/commandes','Commandes & livraisons','Administration'],['admin/commande/o1','Suivi administrateur','Administration'],['composants','Bibliothèque de composants','Design system']];
function presentation(){return `<section class="cover"><p class="eyebrow">GSB / MAQUETTE INTERACTIVE / VERSION 01</p><h1>Le soin commence<br>par une relation de confiance.</h1><p>Une e-boutique professionnelle pour connecter les professionnels de santé et les laboratoires partenaires.</p><div class="row section-gap">${link('Explorer la boutique '+icon('arrow',18),'connexion','primary')}${link('Voir les composants','composants','secondary')}</div><div class="cover-stats"><div class="cover-stat"><strong>3</strong><span>espaces métiers</span></div><div class="cover-stat"><strong>25</strong><span>écrans de référence</span></div><div class="cover-stat"><strong>1440 / 390</strong><span>desktop et mobile</span></div></div></section><div class="grid-3 section-gap"><section class="panel"><span class="stat-icon">${icon('user')}</span><h2>Professionnel de santé</h2><p class="muted">Trouver un produit, constituer un panier, passer une commande et suivre son historique.</p>${btn('Démarrer ce parcours','start-role','secondary',`data-role="professionnel"`)}</section><section class="panel"><span class="stat-icon">${icon('lab')}</span><h2>Laboratoire partenaire</h2><p class="muted">Soumettre ses produits et gérer leur stock fictif, avec un périmètre limité à son laboratoire.</p>${btn('Démarrer ce parcours','start-role','secondary',`data-role="fournisseur"`)}</section><section class="panel"><span class="stat-icon">${icon('shield')}</span><h2>Administration GSB</h2><p class="muted">Valider les produits, gérer les partenaires et superviser commandes et livraisons simulées.</p>${btn('Démarrer ce parcours','start-role','secondary',`data-role="admin"`)}</section></div><section class="screen-directory section-gap"><div class="row between"><div><p class="eyebrow">EXPLORER LE FICHIER</p><h2>Tous les écrans, au même endroit.</h2></div>${btn('Réinitialiser la démonstration','reset-demo','ghost small')}</div><div class="directory-grid">${screenList.map(([path,name,group],i)=>`<a class="directory-link" href="#${path}"><span>${String(i+1).padStart(2,'0')}</span><div><small>${group}</small><strong>${name}</strong></div>${icon('arrow',16)}</a>`).join('')}</div></section><div class="notice section-gap">${icon('lab')}<span>Projet BTS SIO SLAM 2 · IPSSI Paris · Rezki Zouaoui, Kelian Luye et Mekhali. Paiement, livraison et stock entièrement fictifs.</span></div>`;}
function components(){return heading('Un langage visuel commun.','Des composants cohérents pour les trois espaces et les versions mobiles.',link('Présentation','presentation','ghost'))+`<section class="panel"><p class="eyebrow">01 / IDENTITÉ</p><h2>Des repères clairs, à chaque interaction.</h2><div class="color-grid">${[['Bleu nuit','#142D4E'],['Turquoise','#159A9C'],['Action accessible','#0C7476'],['Fond','#F5F7FA'],['Texte','#1F2937'],['Secondaire','#64748B']].map(([n,c])=>`<div class="swatch"><div style="background:${c}"></div><strong>${n}</strong><small>${c}</small></div>`).join('')}</div><div class="type-specimen"><h1>Une relation de confiance.</h1><h2>Une hiérarchie lisible.</h2><p>Inter · 16 px / 24 px — Les informations essentielles au bon endroit.</p><small>Échelle : 12 / 14 / 16 / 20 / 24 / 32 / 40 / 56 · Espacements : 8 / 16 / 24 / 32 / 48 / 64.</small></div></section><div class="component-grid section-gap"><section class="panel"><p class="eyebrow">02 / ACTIONS</p><h2>Boutons et états</h2><div class="row wrap section-gap">${btn('Action principale','noop','primary')}${btn('Secondaire','noop','secondary')}${btn('Discret','noop','ghost')}${btn('Refuser','noop','danger')}</div><div class="row wrap section-gap"><button class="btn primary is-hover">Survol</button><button class="btn primary is-focus">Focus</button><button class="btn primary" disabled>Désactivé</button><button class="btn primary is-loading" disabled>Chargement…</button></div></section><section class="panel"><p class="eyebrow">03 / STATUTS</p><h2>Des états accompagnés d’un libellé</h2><div class="row wrap section-gap">${['En attente','Accepté','Refusé','Validée','Annulée','En préparation','Expédiée','Livrée'].map(badge).join('')}</div></section><section class="panel"><p class="eyebrow">04 / SAISIE</p><h2>Champs et validation</h2>${field('Email professionnel','example','lina.martin@exemple.test','email')}<label class="field is-error"><span>Confirmer le mot de passe *</span><input type="password" value="incorrect"><small>Les mots de passe ne correspondent pas.</small></label>${field('Laboratoire associé','readonly','Laboratoire Aster','text','readonly')}</section><section class="panel"><p class="eyebrow">05 / RETOURS</p><h2>Notifications et aide</h2><div class="notice success">${icon('check')}<span>Le produit a été ajouté à votre panier.</span></div><div class="notice danger section-gap">${icon('alert')}<span>Stock insuffisant. Choisissez une quantité inférieure.</span></div>${simulation('Aucune opération réelle.')}</section><section class="panel"><p class="eyebrow">06 / CONTENU</p><h2>Carte produit réutilisable</h2><div style="max-width:320px">${productCard(state.products[0])}</div></section><section class="panel"><p class="eyebrow">07 / NAVIGATION</p><h2>Quantité, étapes et chargement</h2><div class="quantity section-gap"><button aria-label="Diminuer">${icon('minus',16)}</button><output>2</output><button aria-label="Augmenter">${icon('plus',16)}</button></div>${steps(1)}<div class="skeleton" style="height:24px;width:80%"></div><div class="skeleton section-gap" style="height:80px"></div></section></div><section class="panel section-gap"><p class="eyebrow">08 / ÉTATS VIDES</p>${empty('Votre sélection est vide.','Une phrase claire, suivie d’une action utile.',link('Explorer le catalogue','catalogue','primary'))}</section>`;}
function page(route){const [a,b,c]=route.split('/');if(route==='presentation')return presentation();if(route==='composants')return components();if(route==='connexion')return login();if(route==='mot-de-passe')return login(true);if(route==='catalogue')return catalog();if(a==='produit')return productDetail(b);if(route==='panier')return cart();if(route==='validation')return checkout();if(a==='paiement')return payment(b);if(a==='confirmation')return confirmation(b);if(route==='commandes')return orders();if(a==='commande')return orderDetail(b);if(route==='compte')return account();if(a==='fournisseur'){if(!b)return supplierDashboard();if(b==='produits')return supplierProducts();if(b==='ajouter')return productForm();if(b==='modifier')return productForm(c);if(b==='stock')return stock();}if(a==='admin'){if(!b)return adminDashboard();if(b==='validation')return adminValidation();if(b==='examen')return adminExamine(c);if(b==='comptes')return adminUsers();if(b==='laboratoires')return adminLabs();if(b==='categories')return adminCategories();if(b==='commandes')return orders(true);if(b==='commande')return orderDetail(c,true);}return presentation();}
function render(){let route=ui.route||location.hash.slice(1)||new URLSearchParams(location.search).get('screen')||'presentation';ui.route=route;if(sessionUser()?.mustChange&&!['connexion','mot-de-passe','presentation','composants'].includes(route)){route='mot-de-passe';ui.route=route;}if(route.startsWith('admin'))state.role='admin';else if(route.startsWith('fournisseur'))state.role='fournisseur';else if(!['connexion','mot-de-passe','presentation','composants'].includes(route))state.role='professionnel';$('#app').innerHTML=wrap(route,page(route));document.title='GSB · '+(screenList.find(s=>s[0]===route)?.[1]||'Maquette professionnelle');if(route==='catalogue')bindCatalog();window.scrollTo(0,0);}
function bindCatalog(){const update=()=>{$('#product-grid').innerHTML=catalogGrid();$('#result-count').textContent=filteredProducts().length;};$('#catalog-search').addEventListener('input',e=>{ui.search=e.target.value;update();});$('#category-filter').addEventListener('change',e=>{ui.cat=e.target.value;render();});$('#lab-filter').addEventListener('change',e=>{ui.lab=e.target.value;render();});$('#sort-filter').addEventListener('change',e=>{ui.sort=e.target.value;update();});}
function go(path){ui.route=path;closeModal();ui.qty=1;ui.tableSearch='';render();}
function toast(message,error=false){$('#feedback').innerHTML=`<div class="toast ${error?'danger':''}" role="status">${icon(error?'alert':'check',20)}<span>${esc(message)}</span><button class="btn icon ghost" data-action="dismiss-toast" aria-label="Fermer la notification">${icon('close',16)}</button></div>`;setTimeout(()=>{$('#feedback').innerHTML='';},4500);}
function modal(title,content,footer=''){const el=$('#overlays');el.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row between"><h2 id="modal-title">${title}</h2><button class="btn icon ghost" data-action="close-modal" aria-label="Fermer la fenêtre">${icon('close')}</button></div>${content}${footer}</section></div>`;el.querySelector('input,select,button')?.focus();}
function closeModal(){$('#overlays').innerHTML='';}
let pendingAction=null;
function confirmAction(title,message,action,label='Confirmer'){pendingAction=action;modal(title,`<p class="muted">${message}</p>`,`<div class="row end section-gap">${btn('Annuler','close-modal','secondary')}${btn(label,'confirm-action','primary')}</div>`);}
document.addEventListener('click',e=>{
  const anchor=e.target.closest('a[href^="#"]');
  if(!anchor)return;
  const destination=anchor.getAttribute('href').slice(1);
  if(!destination||destination==='main')return;
  e.preventDefault();e.stopPropagation();go(destination);
},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;e.preventDefault();if(a==='noop')return;if(a==='dismiss-toast'){$('#feedback').innerHTML='';return;}if(a==='close-modal'){closeModal();return;}if(a==='confirm-action'){const f=pendingAction;closeModal();pendingAction=null;f?.();return;}if(a==='start-role'){ui.loginRole=el.dataset.role;go('connexion');return;}if(a==='demo-role'){ui.loginRole=el.dataset.role;render();return;}if(a==='toggle-password'){const input=$('[name="password"]');input.type=input.type==='password'?'text':'password';el.setAttribute('aria-label',input.type==='password'?'Afficher le mot de passe':'Masquer le mot de passe');return;}if(a==='toggle-filters'){ui.filtersOpen=!ui.filtersOpen;render();return;}if(a==='reset-filters'){ui.search='';ui.cat='';ui.lab='';ui.sort='default';render();return;}if(a==='category'){ui.cat=id;render();return;}if(a==='detail-qty'){const p=product(id),delta=Number(el.dataset.delta);if(delta>0&&p&&ui.qty>=p.stock){toast('La quantité ne peut pas dépasser le stock disponible.',true);return;}ui.qty=Math.max(1,ui.qty+delta);$('#detail-qty').textContent=ui.qty;return;}if(a==='add-cart'){const p=product(id);if(!p||!available(p))return;const qty=el.dataset.detail?ui.qty:1,line=state.cart.find(l=>l.product===id);if((line?.qty||0)+qty>p.stock){toast('Stock insuffisant. Réduisez la quantité dans votre panier.',true);return;}if(line)line.qty+=qty;else state.cart.push({product:id,qty});persist();render();toast('Produit ajouté à votre panier.');return;}if(a==='cart-qty'){const line=state.cart.find(l=>l.product===id),p=product(id),next=line.qty+Number(el.dataset.delta);if(next>p.stock){toast('Stock insuffisant pour cette quantité.',true);return;}line.qty=Math.max(1,next);persist();render();return;}if(a==='remove-cart'){confirmAction('Retirer ce produit ?',`« ${esc(product(id).name)} » sera retiré de votre panier.`,()=>{state.cart=state.cart.filter(l=>l.product!==id);persist();render();toast('Le produit a été retiré.');},'Retirer le produit');return;}if(a==='pay-success'||a==='pay-fail'){const o=order(id);if(o.status==='Annulée'){toast('Cette commande est annulée ; aucun paiement ne peut être simulé.',true);return;}if(o.payment){toast('Un résultat existe déjà pour cette commande.',true);return;}o.payment={status:a==='pay-success'?'Réussi':'Échoué',reference:'SIM-'+o.reference,date:new Date().toISOString()};persist();go('confirmation/'+id);return;}if(a==='accept-product'||a==='reject-product'){const p=product(id);confirmAction(a==='accept-product'?'Accepter ce produit ?':'Refuser ce produit ?',a==='accept-product'?'Le produit actif sera visible dans le catalogue professionnel.':'Le produit restera absent du catalogue professionnel.',()=>{p.status=a==='accept-product'?'Accepté':'Refusé';persist();go('admin/validation');toast('Décision enregistrée : '+p.status+'.');},a==='accept-product'?'Accepter le produit':'Refuser le produit');return;}if(a==='order-status'){const o=order(id),status=$('#admin-order-status').value;if(o.status==='Annulée'){toast('Une commande annulée ne peut plus changer de statut.',true);return;}if(o.status===status){toast('Ce statut est déjà enregistré.');return;}confirmAction('Mettre à jour la commande ?',`Nouveau statut : ${esc(status)}. Cette modification sera conservée dans l’historique.`,()=>{const date=new Date().toISOString();if(status==='Annulée'&&o.stockDebited===true){for(const line of o.lines){const p=product(line.product);if(p){p.stock+=line.qty;state.movements.unshift({id:uid('m')+'-'+line.product,product:line.product,variation:line.qty,motif:'Annulation de la commande fictive '+o.reference,date});}}o.stockDebited=false;}o.status=status;o.history.push({status,date});persist();render();toast('Le statut a été mis à jour.');});return;}if(a==='delivery-update'){const o=order(id),status=$('#delivery-status').value,now=new Date().toISOString();if(!o.delivery)o.delivery={status:'En préparation',tracking:'FICTIF-'+o.reference,shipped:null,delivered:null};o.delivery.status=status;if(status==='En préparation'){o.delivery.shipped=null;o.delivery.delivered=null;}else if(status==='Expédiée'){o.delivery.shipped||=now;o.delivery.delivered=null;}else if(status==='Livrée'){o.delivery.shipped||=now;o.delivery.delivered||=now;}persist();render();toast('Le suivi de livraison fictif a été actualisé.');return;}if(a==='toggle-user'){const u=state.users.find(u=>u.id===id);confirmAction(u.active?'Désactiver ce compte ?':'Activer ce compte ?',esc(u.name)+' · '+esc(u.role),()=>{u.active=!u.active;persist();render();toast('Le compte a été mis à jour.');});return;}if(a==='toggle-lab'){const l=state.labs.find(l=>l.id===id);confirmAction('Modifier l’activation du laboratoire ?',esc(l.name),()=>{l.active=!l.active;persist();render();toast('Le laboratoire a été mis à jour.');});return;}if(a==='toggle-category'){const c=state.categories.find(c=>c.id===id);c.active=!c.active;persist();render();toast('La catégorie a été mise à jour.');return;}if(a==='new-category'||a==='edit-category'){const c=state.categories.find(c=>c.id===id);modal(c?'Modifier la catégorie':'Ajouter une catégorie',`<form id="category-form" data-id="${c?.id||''}">${field('Nom de la catégorie *','name',c?.name||'Nouvelle catégorie','text','required')}<label class="field"><span>Description</span><textarea name="description" rows="3">${esc(c?.description||'')}</textarea></label><button class="btn primary full-width" type="submit">Enregistrer la catégorie</button></form>`);return;}if(a==='new-user'){modal('Ajouter un compte',`<form id="user-form">${field('Nom complet *','name','Robin Petit','text','required')}${field('Email *','email','robin@exemple.test','email','required')}<label class="field"><span>Rôle *</span><select name="role" id="new-user-role"><option>Professionnel</option><option>Fournisseur</option><option>Administrateur</option></select></label><label class="field"><span>Laboratoire · obligatoire pour Fournisseur</span><select name="lab"><option value="">Sans rattachement</option>${state.labs.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></label><label class="checkbox-label"><input name="mustChange" type="checkbox" checked> Changement de mot de passe à la première connexion</label><p class="form-error" id="user-error"></p><button class="btn primary full-width" type="submit">Créer le compte fictif</button></form>`);return;}if(a==='new-lab'){modal('Ajouter un laboratoire partenaire',`<form id="lab-form">${field('Raison sociale *','name','Laboratoire Horizon','text','required')}${field('Email de contact *','email','contact@horizon.exemple.test','email','required')}<h3 class="section-gap">Premier compte fournisseur</h3>${field('Nom du responsable *','userName','Morgan Dubois','text','required')}${field('Email du compte *','userEmail','morgan@horizon.exemple.test','email','required')}<p class="muted">Le laboratoire et son premier compte sont créés ensemble.</p><button class="btn primary full-width" type="submit">Créer le laboratoire et son compte</button></form>`);return;}if(a==='reset-demo'){confirmAction('Recommencer la démonstration ?','Seules les données fictives créées dans cette maquette seront réinitialisées.',()=>{state=structuredClone(initial);persist();ui.search='';ui.cat='';ui.lab='';ui.status='';render();toast('La démonstration est prête.');},'Réinitialiser');return;}});
document.addEventListener('change',e=>{if(e.target.id==='table-search'){ui.tableSearch=e.target.value;render();}if(e.target.id==='product-status-filter'){ui.status=e.target.value;render();}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.id)return;e.preventDefault();const data=Object.fromEntries(new FormData(form));if(form.id==='login-form'){const email=String(data.email||'').trim().toLowerCase(),u=state.users.find(u=>u.email.toLowerCase()===email&&u.role===roleLabel(ui.loginRole));if(!u){toast('Ce compte fictif est inconnu pour le parcours choisi. Vérifiez l’email et le rôle.',true);return;}if(!u.active){toast('Ce compte fictif est désactivé.',true);return;}if(u.role==='Fournisseur'&&!state.labs.some(l=>l.id===u.lab&&l.active)){toast('Le laboratoire rattaché à ce compte est absent ou désactivé.',true);return;}state.currentUserId=u.id;state.role=ui.loginRole;if(u.role==='Fournisseur')state.labId=u.lab;persist();go(u.mustChange?'mot-de-passe':roleHome(state.role));}if(form.id==='password-form'){const u=sessionUser();if(!u){toast('Choisissez d’abord un compte fictif sur l’écran de connexion.',true);go('connexion');return;}if(data.password!==data.confirm){$('#password-error').textContent='Les mots de passe ne correspondent pas. Vérifiez la confirmation.';return;}u.mustChange=false;persist();go(roleHome(state.role));toast('Mot de passe de démonstration mis à jour.');}if(form.id==='profile-form'){state.profile={...state.profile,...data,name:data.first+' '+data.last};persist();toast('Vos informations ont été enregistrées.');}if(form.id==='checkout-form'){const lines=cartLines();if(!lines.length||lines.some(l=>l.qty<1||l.qty>product(l.id).stock||!available(product(l.id)))){toast('Vérifiez les quantités et la disponibilité de votre panier.',true);go('panier');return;}const date=new Date().toISOString(),o={id:uid('o'),reference:'GSB-2026-'+String(143+state.orders.length-2).padStart(5,'0'),date,status:'En attente',stockDebited:true,address:data.address+', '+data.postal+' '+data.city+' — adresse fictive',lines:lines.map(l=>({product:l.id,name:l.name,qty:l.qty,price:l.price,tva:l.tva})),payment:null,delivery:null,history:[{status:'En attente',date}]};for(const l of lines){product(l.id).stock-=l.qty;state.movements.unshift({id:uid('m'),product:l.id,variation:-l.qty,motif:'Commande fictive '+o.reference,date});}state.orders.unshift(o);state.cart=[];persist();go('paiement/'+o.id);}if(form.id==='product-form'){const existing=product(form.dataset.id);if(existing&&existing.lab!==state.labId){toast('Ce produit ne dépend pas de votre laboratoire.',true);return;}const p={id:existing?.id||uid('p'),name:data.name,description:data.description,category:data.category,lab:state.labId,price:Number(data.price),tva:Number(data.tva),stock:existing?existing.stock:Number(data.stock),status:'En attente',active:data.active==='on',format:data.format||'Conditionnement professionnel',color:state.labs.find(l=>l.id===state.labId).color,code:existing?.code||'AST-'+String(state.products.length+1).padStart(3,'0'),image_url:data.image_url};if(existing)Object.assign(existing,p);else state.products.push(p);persist();go('fournisseur/produits');toast('Produit soumis à GSB. Statut : En attente.');}if(form.id==='stock-form'){const p=product(data.product),variation=Number(data.variation);if(!p||p.lab!==state.labId){$('#stock-error').textContent='Choisissez un produit rattaché à votre laboratoire.';return;}if(!Number.isInteger(variation)||variation===0||p.stock+variation<0){$('#stock-error').textContent='Saisissez une variation entière, non nulle, laissant un stock positif ou nul.';return;}p.stock+=variation;state.movements.unshift({id:uid('m'),product:p.id,variation,motif:data.motif,date:new Date().toISOString()});persist();render();toast('Le mouvement de stock fictif a été enregistré.');}if(form.id==='category-form'){const c=state.categories.find(c=>c.id===form.dataset.id);if(c)Object.assign(c,{name:data.name,description:data.description});else state.categories.push({id:uid('c'),name:data.name,description:data.description,active:true});persist();closeModal();render();toast('La catégorie a été enregistrée.');}if(form.id==='user-form'){if(data.role==='Fournisseur'&&!data.lab){$('#user-error').textContent='Choisissez le laboratoire auquel rattacher ce compte fournisseur.';return;}state.users.push({id:uid('u'),name:data.name,email:data.email,role:data.role,lab:data.role==='Fournisseur'?data.lab:null,active:true,mustChange:data.mustChange==='on'});persist();closeModal();render();toast('Le compte fictif a été créé.');}if(form.id==='lab-form'){const id=uid('l');state.labs.push({id,name:data.name,email:data.email,active:true,color:'#159A9C'});state.users.push({id:uid('u'),name:data.userName,email:data.userEmail,role:'Fournisseur',lab:id,active:true,mustChange:true});persist();closeModal();render();toast('Le laboratoire et son premier compte fournisseur ont été créés.');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(ui.filtersOpen){ui.filtersOpen=false;render();}}if(e.key==='Tab'&&$('#overlays .modal')){const focusable=[...$('#overlays .modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{closeModal();ui.qty=1;ui.tableSearch='';render();});
render();
